<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Cliente</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <header class="encabezado">
        <h1>Calculadora comparativa</h1>
        <nav>
            <a href="/servidor">Servidor</a>
            <a href="/cliente">Cliente</a>
        </nav>
    </header>

    <main class="contenedor">
        <section class="tarjeta">
            <h2>Procesamiento del lado del cliente</h2>
            <p>JavaScript realiza la operación sin recargar la página.</p>

            <form id="formCalculadora">
                <label for="numero1">Primer número</label>
                <input id="numero1" type="number" step="any" required>

                <label for="numero2">Segundo número</label>
                <input id="numero2" type="number" step="any" required>

                <label for="operacion">Operación</label>
                <select id="operacion">
                    <option value="suma">Suma</option>
                    <option value="resta">Resta</option>
                    <option value="multiplicacion">Multiplicación</option>
                    <option value="division">División</option>
                </select>

                <button type="submit">Calcular con JavaScript</button>
            </form>

            <p id="resultado" class="resultado oculto"></p>
            <p id="error" class="error oculto"></p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/calculadora.js') }}"></script>
</body>
</html>
